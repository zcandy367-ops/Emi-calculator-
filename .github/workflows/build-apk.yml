name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          JAVA_VERSION_RAW="$(java -version 2>&1 | awk -F'"' '/version/ {print $2; exit}')"
          if [ -z "${JAVA_VERSION_RAW}" ]; then
            echo "::error::Could not detect active Java version."
            exit 1
          fi
          if [[ "${JAVA_VERSION_RAW}" == 1.* ]]; then
            JAVA_MAJOR="$(echo "${JAVA_VERSION_RAW}" | cut -d'.' -f2)"
          else
            JAVA_MAJOR="$(echo "${JAVA_VERSION_RAW}" | cut -d'.' -f1 | sed 's/[^0-9].*//')"
          fi
          if [ -z "${JAVA_MAJOR}" ] || ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '${JAVA_VERSION_RAW}'."
            exit 1
          fi
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+${JAVA_HOME}/bin/}keytool"
          if [ ! -x "${KEYTOOL_BIN}" ]; then
            KEYTOOL_BIN="$(command -v keytool || true)"
          fi
          if [ -z "${KEYTOOL_BIN}" ]; then
            echo "::error::keytool binary not found in configured Java 17 installation."
            exit 1
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Temporary ./debug.keystore already exists; skipping generation."
          else
            echo "Generating temporary ./debug.keystore..."
            "${KEYTOOL_BIN}" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create temporary ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "${APK_PATH}" ]; then
            echo "::error::Expected debug APK not found at ${APK_PATH}"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is not a regular file."
            exit 1
          fi

          if [ ! -s "${APK_PATH}" ]; then
            echo "::error::${APK_PATH} is empty."
            exit 1
          fi

          if [[ "${APK_PATH}" != *.apk ]]; then
            echo "::error::${APK_PATH} does not have the .apk extension."
            exit 1
          fi

          echo "Verified debug APK at ${APK_PATH} ($(wc -c < "${APK_PATH}") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${SRC_APK}" ] || [ ! -s "${SRC_APK}" ]; then
            echo "::error::Verified debug APK missing at ${SRC_APK}"
            exit 1
          fi

          REPO_RAW="${GITHUB_REPOSITORY#*/}"
          REPO_SAFE="$(printf '%s' "${REPO_RAW}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/--*/-/g; s/^[.-]*//; s/[.-]*$//')"
          if [ -z "${REPO_SAFE}" ]; then
            REPO_SAFE="android-app"
          fi

          ASSET_FILENAME="${REPO_SAFE}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset.XXXXXX")"
          DEST_APK="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "${SRC_APK}" "${DEST_APK}"

          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ] || [[ "${DEST_APK}" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed at ${DEST_APK}"
            exit 1
          fi

          {
            echo "asset_path=${DEST_APK}"
            echo "asset_name=${ASSET_FILENAME}"
          } >> "${GITHUB_OUTPUT}"
          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not installed on the runner."
            exit 1
          fi
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing or invalid: ${ASSET_PATH:-unset}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** ${ASSET_NAME}

          > **Note:** This APK is intended for testing only. It is not a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

          RELEASE_URL="$(gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "${RELEASE_NOTES}" \
            --target "${GITHUB_SHA}" \
            --latest | tail -n 1 | tr -d '[:space:]')"

          if [ -z "${RELEASE_URL}" ]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url -q .url)"
          fi

          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
            echo "release_url=${RELEASE_URL}"
          } >> "${GITHUB_OUTPUT}"

      - name: Report APK download result
        if: always() && steps.publish_release.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          RELEASE_URL: ${{ steps.publish_release.outputs.release_url }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_OUTCOME}" = "success" ]; then
            echo "Verifying published GitHub Release..."
            gh release view "${RELEASE_TAG}" --json tagName,name,url,assets
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            {
              echo "### Debug APK Build & GitHub Release Succeeded"
              echo ""
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **APK Asset:** \`${ASSET_NAME}\`"
              echo "- **Direct Download Page:** ${RELEASE_URL}"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above. The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build and GitHub Actions artifact upload (app-debug-apk) succeeded."
            echo "APK build succeeded. Backup Actions artifact available: app-debug-apk"

            {
              echo "### Debug APK Built (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases failed, so no release URL was created."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` (available on this workflow run's Summary page)"
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
